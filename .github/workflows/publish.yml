# Publishes the package to PyPI when a version tag (v0.0.2, …) is pushed, or by hand
# from the Actions tab. No token: PyPI trusts this workflow (Trusted Publishing,
# project datasportsapi → Publishing → GitHub: datasportsapi/datasportsapi-python,
# workflow publish.yml, environment pypi).
name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -I test_client.py
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
