# Publishes the package to PyPI when a version tag (v0.1.0, …) is pushed, or by hand
# from the Actions tab. No token: PyPI trusts this workflow (Trusted Publishing,
# project datasportsapi → Publishing → GitHub: datasportsapi/datasportsapi-python,
# workflow publish.yml, environment pypi).
# Two jobs, as PyPA recommends: "build" tests and builds without any credential;
# "publish" holds the short-lived publishing credential and runs no build tools,
# only the official upload action on the files the first job made.
name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.12
      - name: Scan for secrets
        run: node scan-secrets.mjs .
      - name: Version matches the tag
        run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          test "v${v}" = "${GITHUB_REF_NAME}" || test "${GITHUB_EVENT_NAME}" = workflow_dispatch
      - name: Test
        run: |
          python3.10 -I test_client.py
          python -I test_client.py
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Scan the built files
        run: node scan-secrets.mjs dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
