[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "datasportsapi"
version = "0.0.2"
description = "Official client for the DataSportsAPI sports data API (pre-release: a minimal client; the full SDK arrives with 0.1)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Noventra Software Ltd" }]
keywords = ["sports", "sports api", "sports data", "live scores", "football", "api client"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://datasportsapi.com/sdks/python/"
Documentation = "https://datasportsapi.com/docs/sdks/"
Source = "https://github.com/datasportsapi/datasportsapi-python"
Issues = "https://github.com/datasportsapi/datasportsapi-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/datasportsapi"]

[tool.hatch.build.targets.sdist]
include = ["src/datasportsapi", "README.md", "LICENSE", "pyproject.toml"]
