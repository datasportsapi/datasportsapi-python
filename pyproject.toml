[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "datasportsapi"
version = "0.2.0"
description = "Official Python client for the DataSportsAPI sports data API: a typed method per endpoint, sync and asyncio, paging, retries and the live WebSocket stream."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DataSportsAPI" }]
keywords = ["sports", "sports api", "sports data", "live scores", "football", "api client", "websocket"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: AsyncIO",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://datasportsapi.com/sdks/python/"
Documentation = "https://datasportsapi.com/docs/"
Source = "https://github.com/datasportsapi/datasportsapi-python"
Issues = "https://github.com/datasportsapi/datasportsapi-python/issues"

# Only the package goes into the wheel and the sdist: no tests, no scan script, no .venv.
[tool.hatch.build.targets.wheel]
packages = ["src/datasportsapi"]
exclude = ["__pycache__", "*.pyc"]

[tool.hatch.build.targets.sdist]
only-include = ["src/datasportsapi", "README.md", "LICENSE", "pyproject.toml"]
exclude = ["__pycache__", "*.pyc"]
